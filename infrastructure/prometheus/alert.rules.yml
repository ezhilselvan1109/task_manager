groups:
  - name: taskmanager-alerts
    rules:
      - alert: ServiceDown
        expr: up{job="spring-boot-services"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Microservice instance {{ $labels.instance }} is down"
          description: "Service has been unreachable for more than 1 minute."

      - alert: HighHttpErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) / rate(http_server_requests_seconds_count[5m]) * 100 > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx error rate on {{ $labels.instance }}"
          description: "HTTP 5xx error rate exceeds 5% for 5 minutes."

      - alert: HighTaskServiceLatency
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High P95 latency (> 500ms)"
          description: "P95 request duration exceeded 500ms for 5 minutes."

