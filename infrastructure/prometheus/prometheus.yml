global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "alert.rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'spring-boot-services'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets:
          - 'taskmanager-discovery:8761'
          - 'taskmanager-api-gateway:8080'
          - 'taskmanager-user-service:8081'
          - 'taskmanager-task-service:8082'
          - 'taskmanager-notification-service:8083'

