apiVersion: v1
kind: Service
metadata:
  name: task-service
  namespace: taskmanager
spec:
  ports:
    - port: 8082
      targetPort: 8082
      name: http
  selector:
    app: task-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-service
  namespace: taskmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-service
  template:
    metadata:
      labels:
        app: task-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8082"
    spec:
      containers:
        - name: task-service
          image: docker.io/library/taskmanager-task-service:production
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: taskmanager-config
          env:
            - name: SERVER_PORT
              value: "8082"
            - name: JAVA_OPTS
              value: "-XX:+UseG1GC -XX:+UseContainerSupport -Xms128m -Xmx256m"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgresql:5432/task_db"
            - name: SPRING_DATASOURCE_USERNAME
              value: "task_app"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskmanager-secrets
                  key: DB_TASK_PASSWORD
            - name: DB_USER
              value: "task_app"
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: taskmanager-secrets
                  key: DB_TASK_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 35
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "448Mi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: task-service-hpa
  namespace: taskmanager
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: task-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
