apiVersion: v1
kind: ConfigMap
metadata:
  name: taskmanager-config
  namespace: taskmanager
data:
  SPRING_PROFILES_ACTIVE: "docker"
  DB_HOST: "mysql"
  DB_PORT: "3306"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_TOPIC_TASK_EVENTS: "task-events"
  KAFKA_TOPIC_TASK_EVENTS_DLT: "task-events.DLT"
  EUREKA_SERVER_URL: "http://service-discovery:8761/eureka/"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-discovery:8761/eureka/"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-script
  namespace: taskmanager
data:
  init-multi-db.sh: |
    #!/bin/bash
    set -euo pipefail
    mysql -u root -p"${MYSQL_ROOT_PASSWORD}" <<-EOSQL
      CREATE DATABASE IF NOT EXISTS user_db CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
      CREATE USER IF NOT EXISTS 'user_app'@'%' IDENTIFIED BY '${DB_USER_PASSWORD}';
      GRANT ALL PRIVILEGES ON user_db.* TO 'user_app'@'%';

      CREATE DATABASE IF NOT EXISTS task_db CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
      CREATE USER IF NOT EXISTS 'task_app'@'%' IDENTIFIED BY '${DB_TASK_PASSWORD}';
      GRANT ALL PRIVILEGES ON task_db.* TO 'task_app'@'%';

      CREATE DATABASE IF NOT EXISTS notification_db CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
      CREATE USER IF NOT EXISTS 'notification_app'@'%' IDENTIFIED BY '${DB_NOTIF_PASSWORD}';
      GRANT ALL PRIVILEGES ON notification_db.* TO 'notification_app'@'%';

      FLUSH PRIVILEGES;
    EOSQL
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-nginx-config
  namespace: taskmanager
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        location /healthz {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /api/ {
            proxy_pass http://api-gateway:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $http_x_correlation_id;
        }

        location / {
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
