apiVersion: v1
kind: ConfigMap
metadata:
  name: taskmanager-config
  namespace: taskmanager
data:
  SPRING_PROFILES_ACTIVE: "docker"
  DB_HOST: "postgresql"
  DB_PORT: "5432"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_TOPIC_TASK_EVENTS: "task-events"
  KAFKA_TOPIC_TASK_EVENTS_DLT: "task-events.DLT"
  EUREKA_SERVER_URL: "http://service-discovery:8761/eureka/"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-discovery:8761/eureka/"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: taskmanager
data:
  init-multi-db.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      CREATE USER user_app WITH PASSWORD '${DB_USER_PASSWORD}';
      CREATE DATABASE user_db OWNER user_app;
      GRANT ALL PRIVILEGES ON DATABASE user_db TO user_app;

      CREATE USER task_app WITH PASSWORD '${DB_TASK_PASSWORD}';
      CREATE DATABASE task_db OWNER task_app;
      GRANT ALL PRIVILEGES ON DATABASE task_db TO task_app;

      CREATE USER notification_app WITH PASSWORD '${DB_NOTIF_PASSWORD}';
      CREATE DATABASE notification_db OWNER notification_app;
      GRANT ALL PRIVILEGES ON DATABASE notification_db TO notification_app;
    EOSQL
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-nginx-config
  namespace: taskmanager
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        location /healthz {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /api/ {
            proxy_pass http://api-gateway:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $http_x_correlation_id;
        }

        location / {
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
