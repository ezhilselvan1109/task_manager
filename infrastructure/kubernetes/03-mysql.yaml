apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: taskmanager
spec:
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
  selector:
    app: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: taskmanager
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          args:
            - "--character-set-server=utf8mb4"
            - "--collation-server=utf8mb4_0900_ai_ci"
            - "--innodb-buffer-pool-size=256M"
            - "--max-connections=150"
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskmanager-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: DB_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskmanager-secrets
                  key: DB_USER_PASSWORD
            - name: DB_TASK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskmanager-secrets
                  key: DB_TASK_PASSWORD
            - name: DB_NOTIF_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskmanager-secrets
                  key: DB_NOTIF_PASSWORD
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u root -p$MYSQL_ROOT_PASSWORD --silent"]
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              cpu: "150m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
      volumes:
        - name: init-script
          configMap:
            name: mysql-init-script
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: mysql-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi

