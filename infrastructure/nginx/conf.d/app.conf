# =========================================================================
# Task Management Platform - Domain & Subdomain Aliases Reverse Proxy (HTTP)
# Domain: ezhilselvan.tech -> VPS 201.18.206.239
# =========================================================================

# Use Docker's embedded DNS resolver so dynamic upstreams (like Jenkins)
# never prevent Nginx from starting when an upstream container restarts.
resolver 127.0.0.11 valid=30s ipv6=off;

upstream frontend_upstream {
    server frontend:80;
    keepalive 32;
}

upstream gateway_upstream {
    server api-gateway:8080;
    keepalive 32;
}

upstream grafana_upstream {
    server grafana:3000;
    keepalive 16;
}

upstream prometheus_upstream {
    server prometheus:9090;
    keepalive 16;
}

upstream alertmanager_upstream {
    server alertmanager:9093;
    keepalive 8;
}

upstream cadvisor_upstream {
    server cadvisor:8080;
    keepalive 8;
}

upstream eureka_upstream {
    server service-discovery:8761;
    keepalive 8;
}

# -------------------------------------------------------------------------
# 1. Primary Web App: ezhilselvan.tech, www.ezhilselvan.tech, app.ezhilselvan.tech & Direct IP
# -------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ezhilselvan.tech www.ezhilselvan.tech app.ezhilselvan.tech _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        proxy_pass http://gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        client_max_body_size 10M;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# -------------------------------------------------------------------------
# 2. API Gateway Alias: api.ezhilselvan.tech
# -------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.ezhilselvan.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        proxy_pass http://gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        client_max_body_size 10M;
    }
}

# -------------------------------------------------------------------------
# 3. Jenkins CI/CD Alias: jenkins.ezhilselvan.tech
# -------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name jenkins.ezhilselvan.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        set $jenkins_backend http://jenkins:8080;
        proxy_pass $jenkins_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_request_buffering off;
        client_max_body_size 50M;
    }
}

