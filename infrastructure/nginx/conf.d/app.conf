# =========================================================================
# Task Management Platform - Domain & Subdomain Aliases Reverse Proxy (HTTP)
# Domain: ezhilselvan.tech -> VPS 201.18.206.239
# Uses Docker embedded DNS (127.0.0.11) with dynamic variables so container
# recreations NEVER cause stale-IP 502 Bad Gateway errors.
# =========================================================================

resolver 127.0.0.11 valid=10s ipv6=off;

# 1. Primary Web App: ezhilselvan.tech, www.ezhilselvan.tech, app.ezhilselvan.tech & Direct IP
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ezhilselvan.tech www.ezhilselvan.tech app.ezhilselvan.tech _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        set $gateway_backend http://api-gateway:8080;
        proxy_pass $gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        client_max_body_size 10M;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        set $frontend_backend http://frontend:80;
        proxy_pass $frontend_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. API Gateway Alias: api.ezhilselvan.tech
server {
    listen 80;
    listen [::]:80;
    server_name api.ezhilselvan.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location = / {
        default_type application/json;
        return 200 '{"service":"Task Manager API Gateway","status":"UP","health":"/actuator/health","endpoints":["/api/v1/auth/register","/api/v1/auth/login","/api/v1/users/me","/api/v1/tasks","/api/v1/notifications"]}';
    }

    location / {
        set $gateway_backend http://api-gateway:8080;
        proxy_pass $gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        client_max_body_size 10M;
    }
}

# 3. Jenkins CI/CD Alias: jenkins.ezhilselvan.tech
server {
    listen 80;
    listen [::]:80;
    server_name jenkins.ezhilselvan.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        set $jenkins_backend http://jenkins:8080;
        proxy_pass $jenkins_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
