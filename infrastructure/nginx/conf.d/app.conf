# =========================================================================
# Task Management Platform - Production Reverse Proxy Virtual Host
# File: infrastructure/nginx/conf.d/app.conf
# =========================================================================

upstream frontend_upstream {
    server frontend:80;
    keepalive 32;
}

upstream gateway_upstream {
    server api-gateway:8080;
    keepalive 32;
}

upstream grafana_upstream {
    server grafana:3000;
    keepalive 16;
}

# -------------------------------------------------------------------------
# HTTP Server (Port 80): Primary Entrypoint for Web SPA, API Gateway, and Grafana
# -------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt ACME Challenge Directory (for automated TLS issuance)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Health Check Endpoint for VPS / Docker healthcheck
    location /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Grafana Observability Dashboard Reverse Proxy
    location /grafana/ {
        proxy_pass http://grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Gateway Reverse Proxy (Microservices routing & authentication)
    location /api/ {
        proxy_pass http://gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;

        client_max_body_size 10M;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Frontend Single Page Application (React 18 Static Bundle & Client Routing)
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

