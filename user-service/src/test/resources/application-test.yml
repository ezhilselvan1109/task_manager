server:
  port: -1

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:h2:mem:user_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

jwt:
  secret: dGFza21hbmFnZXItc3VwZXItc2VjcmV0LWtleS0yNTYtYml0cy1taW5pbXVtLWZvci1oczI1Ng==
  issuer: task-manager-auth
  access-token-expiration-seconds: 900
  refresh-token-expiration-days: 7

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

