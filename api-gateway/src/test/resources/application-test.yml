server:
  port: 0

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: user-auth-route
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/**
        - id: user-profile-route
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**
        - id: task-service-route
          uri: lb://task-service
          predicates:
            - Path=/api/v1/tasks/**
        - id: notification-service-route
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

jwt:
  secret: dGFza21hbmFnZXItc3VwZXItc2VjcmV0LWtleS0yNTYtYml0cy1taW5pbXVtLWZvci1oczI1Ng==
  issuer: task-manager-auth

rate-limiter:
  auth:
    replenish-rate: 5
    burst-capacity: 10
  api:
    replenish-rate: 60
    burst-capacity: 20
  actuator:
    replenish-rate: 120
    burst-capacity: 30

